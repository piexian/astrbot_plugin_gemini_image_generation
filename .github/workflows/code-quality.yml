name: Code Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt \
            pytest pytest-asyncio aiohttp Pillow "pydantic>=2" \
            jsonschema starlette python-multipart

      - name: Run pytest
        run: pytest -q

  frontend:
    name: Frontend (pnpm build & test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.16.1"

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        working-directory: frontend
        run: pnpm test:unit

      - name: Build
        working-directory: frontend
        run: pnpm build

      # views/studio 是提交进仓库的构建产物，构建后必须与提交完全一致。
      - name: Verify committed build output is up to date
        run: git diff --exit-code -- views/studio

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # py312 新增的现代化改写另行分批处理，本次只提升运行基线。
      - name: Ruff lint
        run: |
          ruff check . \
            --line-length 88 \
            --target-version py312 \
            --extend-exclude plans,docs,templates \
            --select F,W,E,ASYNC,C4,Q,I,UP \
            --ignore F403,F405,E501,ASYNC230,ASYNC240,UP017,UP041,UP042,UP047,ASYNC109 \
            --per-file-ignores "__init__.py:F401"

      - name: Ruff format check
        run: ruff format --check . --line-length 88 --exclude plans,docs,templates

  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile all Python files
        run: python -m compileall -q .

  metadata:
    name: Metadata Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate metadata.yaml
        run: |
          python -c "import yaml,sys; yaml.safe_load(open('metadata.yaml',encoding='utf-8')); print('metadata.yaml OK')"

      - name: Validate _conf_schema.json
        run: |
          python -c "import json; json.load(open('_conf_schema.json',encoding='utf-8')); print('_conf_schema.json OK')"
