name: Code Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      frontend: ${{ steps.filter.outputs.frontend }}
      metadata: ${{ steps.filter.outputs.metadata }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect changed files
        run: |
          set -euo pipefail
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
          fi
          if [ -n "$base" ] && ! git rev-parse --verify -q "${base}^{commit}" >/dev/null; then
            base=""
          fi
          if [ -n "$base" ]; then
            git diff --name-only "$base" "$GITHUB_SHA" > changed.txt
          else
            # 首次推送、force push 或手动触发时取不到基线，按本次提交的改动判定。
            git show --name-only --format= "$GITHUB_SHA" > changed.txt
          fi
          cat changed.txt

      - name: Classify changes
        id: filter
        run: |
          set -euo pipefail
          code=false
          frontend=false
          metadata=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            code=true
            frontend=true
            metadata=true
          else
            while IFS= read -r file; do
              case "$file" in
                docs/*|*.md|LICENSE|.gitignore|plans/*) ;;
                frontend/*|views/*|.astrbot-plugin/*)
                  frontend=true
                  code=true
                  ;;
                metadata.yaml)
                  metadata=true
                  ;;
                _conf_schema.json)
                  metadata=true
                  code=true
                  ;;
                *)
                  code=true
                  ;;
              esac
            done < changed.txt
          fi
          echo "code=$code frontend=$frontend metadata=$metadata"
          {
            echo "code=$code"
            echo "frontend=$frontend"
            echo "metadata=$metadata"
          } >> "$GITHUB_OUTPUT"

  pytest:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt \
            pytest pytest-asyncio aiohttp Pillow "pydantic>=2" \
            jsonschema starlette python-multipart

      - name: Run pytest
        run: pytest -q

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Frontend (Vue & Vite+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: frontend
          node-version: "24"
          cache: true

      - name: Format & Lint check
        working-directory: frontend
        run: |
          vp check
          vp lint --deny-warnings

      - name: Vue & TypeScript type-check
        working-directory: frontend
        run: pnpm run type-check

      - name: Vue component unit tests
        working-directory: frontend
        run: vp test run

      - name: Build Studio bundle
        working-directory: frontend
        run: vp build

      # views/studio 是提交进仓库的构建产物，构建后必须与提交完全一致（含未跟踪哈希块检查）。
      - name: Verify committed build output is up to date
        run: |
          git diff --exit-code -- views/studio
          test -z "$(git status --porcelain -- views/studio)"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # py312 新增的现代化改写另行分批处理，本次只提升运行基线。
      - name: Ruff lint
        run: |
          ruff check . \
            --line-length 88 \
            --target-version py312 \
            --extend-exclude plans,docs,templates \
            --select F,W,E,ASYNC,C4,Q,I,UP \
            --ignore F403,F405,E501,ASYNC230,ASYNC240,UP017,UP041,UP042,UP047,ASYNC109 \
            --per-file-ignores "__init__.py:F401"

      - name: Ruff format check
        run: ruff format --check . --line-length 88 --exclude plans,docs,templates

  syntax:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile all Python files
        run: python -m compileall -q .

  metadata:
    needs: changes
    if: needs.changes.outputs.metadata == 'true'
    name: Metadata Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate metadata.yaml
        run: |
          python -c "import yaml,sys; yaml.safe_load(open('metadata.yaml',encoding='utf-8')); print('metadata.yaml OK')"

      - name: Validate _conf_schema.json
        run: |
          python -c "import json; json.load(open('_conf_schema.json',encoding='utf-8')); print('_conf_schema.json OK')"
